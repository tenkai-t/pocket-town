 const first=state.people.find(p=>p.id===$('first').value),second=state.people.find(p=>p.id===$('second').value);
 if(!first||!second||first.id===second){notice('別々の住人を二人選んでください。');return}
 const place=$('place').value, story=stories[place];scene={people:[{...first},{...second}],place,start:performance.now(),result:null};$('placeTitle').textContent=story.name;notice('');
 const p=document.createElement('p');p.textContent=story.prompt+' '+first.name+'は'+reactions[first.personality];
 const choices=document.createElement('div');choices.className='row';
 for(const choice of story.choices){const b=document.createElement('button');b.textContent=choice.name;b.onclick=()=>endOuting(choice);choices.append(b)}
 $('story').replaceChildren(p,choices);
};
function endOuting(choice){
 if(!scene||scene.result)return;
 scene.result=choice;scene.start=performance.now();
 const memory={id:uid(),place:scene.place,people:scene.people,...choice};
 const existing=state.memories.find(m=>m.place===memory.place&&m.title===memory.title&&m.people.every(p=>memory.people.some(v=>p.id===v.id)));
 if(!existing){state.memories=[memory,...state.memories];renderEditor();if(store())notice(choice.reward==='花冠'?'思い出と、着せ替え用の花冠を手に入れました。':'思い出がアルバムに追加されました。')}
 else notice('この思い出はアルバムにあります。');
 const title=document.createElement('strong');title.textContent=choice.title;const p=document.createElement('p');p.textContent=choice.line;
 const b=document.createElement('button');b.textContent='アルバムを見る';b.onclick=()=>switchTab('album');$('story').replaceChildren(title,p,b);
}
function prop(c,reward){
 if(reward==='花冠'){for(let i=0;i<7;i++)rect(c,i%2?'#fff0a8':'#f0a1a8',145+i*4,91+Math.abs(3-i)*2,4,4)}
 if(reward==='半分こ'||reward==='お手伝い'){shape(c,'#ac6e48',[[147,102],[151,94],[165,94],[172,100],[169,108],[149,108]]);rect(c,'#ffdc8d',153,96,12,3);rect(c,'#ffdc8d',158,101,9,2)}
 if(reward==='ジャンプ'){shape(c,'#89afbe',[[135,145],[145,140],[173,140],[184,146],[173,150],[147,150]]);rect(c,'#e5efde',145,143,20,2)}
}
function card(m){
 const c=document.createElement('canvas');c.width=320;c.height=176;const ctx=c.getContext('2d');
 scenery(ctx,320,176,m.place);sprite(ctx,83,64,1.4,m.people[0],'front',900,'joy');sprite(ctx,150,64,1.4,m.people[1],'front',1150,'joy');prop(ctx,m.reward);
 rect(ctx,'#4a3445',0,149,320,27);ctx.fillStyle='#fff1d9';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(m.title,160,166);return c;
}
function renderAlbum(){
 const root=$('memories');root.replaceChildren();
 if(!state.memories.length){const p=document.createElement('p');p.textContent='二人で街へ出かけると、ここに思い出が並びます。';root.append(p);return}
 for(const m of state.memories){
  const article=document.createElement('article');article.className='memory';const frame=document.createElement('div');frame.className='frame';const image=card(m);frame.append(image);
  const title=document.createElement('h3');title.textContent=m.title;const names=document.createElement('small');names.textContent=m.people.map(p=>p.name).join(' ＆ ');
  const b=document.createElement('button');b.textContent='写真を保存';b.onclick=()=>{const a=document.createElement('a');a.href=image.toDataURL('image/png');a.download='pocket-town-'+m.id+'.png';a.click()};
  article.append(frame,title,names,b);root.append(article);
 }
}
const portrait=$('portrait').getContext('2d'),street=$('street').getContext('2d');
let last=0;
function frame(t){
 if(t-last>=32){
  last=t;
  if(tab==='studio'){scenery(portrait,256,176,'studio');sprite(portrait,48,7,2.5,draft,view,t,walk?'walk':'idle')}
  if(tab==='town'){
   scenery(street,320,176,scene?.place||$('place').value);
   if(scene){const elapsed=t-scene.start,travel=scene.result?1:Math.min(1,Math.max(0,elapsed/950));const motion=scene.result?'joy':travel<1?'walk':'idle';
    sprite(street,12+71*travel,64,1.4,scene.people[0],travel<1?'side':'front',t,motion);
    sprite(street,224-74*travel,64,1.4,scene.people[1],'front',t+240,motion);
    if(scene.result)prop(street,scene.result.reward)
   }
  }
 }
 requestAnimationFrame(frame);
}
renderEditor();renderResidents();requestAnimationFrame(frame);
</script></body></html>
